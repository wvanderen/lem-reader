# PRs retain the three-engine reference functional gate. Secondary hosted
# coverage and measurement harnesses run nightly or on manual dispatch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:e2e:coverage
      - run: npm run test:unit -- --run
      - run: npm run build

  e2e-reference:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS, reference]
    timeout-minutes: 90
    env:
      # Reserve a port separate from local development on Vite's default.
      # Keep CI's checked-out server isolated; never reuse that dev server.
      LEM_E2E_BASE: http://localhost:15173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install
      # Keep the shared Mac awake while the suite runs; idle sleep breaks
      # the runner heartbeat and fails the gate without a test verdict.
      - run: caffeinate -i npm run test:e2e:pr -- --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .test-reports/functional.json
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-reference
          include-hidden-files: true
          path: |
            test-results/
            .test-reports/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Playwright (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.project }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  exhaustive-reference:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, reference]
    timeout-minutes: 90
    env:
      LEM_E2E_BASE: http://localhost:15173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install
      - run: caffeinate -i npm run test:e2e -- --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .test-reports/functional.json
      - run: caffeinate -i npm run calibrate
      - run: caffeinate -i npm run perf
      - name: Upload measurement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-artifacts-reference
          include-hidden-files: true
          path: |
            test-results/
            .test-reports/
            .perf-tmp/
            .calibration-tmp/
          retention-days: 7
          if-no-files-found: ignore
