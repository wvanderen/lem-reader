# The blocking gates. PRs and pushes to main retain the three-engine
# reference functional gate; CI runs the lint/format/type/coverage/unit/build
# checks. Nightly evidence (hosted browser matrix, exhaustive reference suite,
# calibration/perf harnesses) lives in evidence.yml and never attaches check
# runs to main — see nightly.yml for how it is dispatched onto the `nightly`
# ref (issue #226: main's check-run surface must stay exactly the gates).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:e2e:coverage
      - run: npm run test:unit -- --run
      - run: npm run build

  e2e-reference:
    runs-on: [self-hosted, macOS, reference]
    timeout-minutes: 90
    # The reference box runs the PR gate AND manual/nightly exhaustive runs.
    # The workflow-level group above is per-event+ref, so a pull_request run
    # and a workflow_dispatch run could start the SAME SECOND on the one Mac
    # (observed 2026-10-13: runs 38480319853 + 38480324742, load > 40,
    # 3.4x first-attempt inflation on both). This shared job-level group
    # queues reference runs serially instead — clean-load timing is what
    # makes the issue #185 before/after comparison valid. The tradeoff is
    # accepted deliberately for this low-traffic repo: a PR gate waits for an
    # in-flight nightly rather than colliding with it, and cancel-in-progress
    # is false so evidence runs are never killed mid-flight (a canceled run
    # is lost evidence, not saved time).
    concurrency:
      group: reference-mac-functional
      cancel-in-progress: false
    env:
      # Reserve a port separate from local development on Vite's default.
      # Keep CI's checked-out server isolated; never reuse that dev server.
      LEM_E2E_BASE: http://localhost:15173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Record machine load for the run (duration interpretation requires it;
      # summarize-e2e.mjs cannot know it from the report alone).
      - run: uptime
      - run: npm ci
      - run: npx playwright install
      # Keep the shared Mac awake while the suite runs; idle sleep breaks
      # the runner heartbeat and fails the gate without a test verdict.
      - run: caffeinate -i npm run test:e2e:pr -- --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .test-reports/functional.json
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-reference
          include-hidden-files: true
          path: |
            test-results/
            .test-reports/
          retention-days: 7
          if-no-files-found: ignore
