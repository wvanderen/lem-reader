# Continuous integration for Lem Reader.
#
# Jobs:
#   checks — lint (incl. the no-dangerouslySetInnerHTML gate), format,
#            typecheck, unit tests, and a production build. Fast,
#            deterministic, OS-independent. Blocking.
#
#   e2e-reference — THE blocking layout gate: the full Playwright suite
#            on the self-hosted reference machine (10-core macOS arm64,
#            the environment the suite's timeouts, longtask budgets, and
#            geometry assertions are calibrated against — where the tree
#            passes 2129/2129). Setup instructions live in CONTRIBUTING.
#            While the runner is offline the job queues (GitHub holds it)
#            and picks up when the machine next connects; a single
#            runner also serializes these across PRs — expected for a
#            personal repo.
#
#   e2e    — the same Playwright suite on GitHub-hosted runners, one
#            matrix leg per desktop engine (chromium/firefox/webkit).
#            NON-BLOCKING on shared runners, deliberately:
#
#            The suite's timeouts, longtask budgets, and
#            interaction-paced assertions are calibrated for a quiet,
#            fast machine (the 10-core macOS reference box; see the
#            workers:3 starvation note in playwright.config.ts). On
#            shared CI runners — ubuntu AND macOS alike — the same tree
#            that passes 2129/2129 specs locally fails ~50 spec sites
#            per engine from CPU contention alone (30s/60s locator
#            timeouts, 569ms longtasks vs a 250ms budget, dialog/
#            popover pacing). The failure sets overlap 52/60 between
#            ubuntu and macOS: OS-independent, i.e. hardware class,
#            not code and not rendering drift.
#
#            Until the suite either runs on a self-hosted reference
#            runner (where it can block) or its timing-sensitive specs
#            grow slow-runner tolerance, this job is evidence, not a
#            gate. Treat consistent e2e failures on a PR as a signal to
#            run the suite locally before merging, not as noise.
#
#   perf   — the ACPT-04 user-approved performance budget harness
#            (incl. the chromium-throttled-mobile profile).
#            NON-BLOCKING (continue-on-error): the locked thresholds in
#            tests/e2e/perf/budget.json were derived on the reference
#            machine (D6-01 measure-first, 25% headroom). First CI runs
#            measured webkit cold cells at 1223–2140ms vs 800–850ms
#            budgets on shared runners — expected, and exactly the data
#            this job exists to collect. Flip it to blocking once a
#            CI-derived budget is user-approved (D6-01 again, on runner
#            hardware).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit -- --run
      - run: npm run build

  e2e-reference:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install
      - run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-reference
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Playwright (${{ matrix.project }})
        run: >-
          npx playwright test --project=${{ matrix.project }} ||
          echo "::warning::e2e failures on a shared runner — see logs and artifacts; run the suite on the reference machine before merging (non-blocking by design)"
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.project }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  perf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Performance budget harness
        run: >-
          npm run perf ||
          echo "::warning::perf budget exceeded on CI hardware — see the budget.compare report above; thresholds are reference-machine-locked (D6-01) and re-baselining requires user approval"
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
