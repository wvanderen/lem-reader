# One-off hosted PR-suite trial; not intended for main.
# Use the existing manual Evidence workflow so no runner routing or gate changes.
name: Hosted PR-suite proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-pr-proof:
    if: github.ref == 'refs/heads/ci/hosted-pr-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEM_E2E_BASE: http://localhost:15173
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: 4e744b42e9da8ee6e57fa46edca9d8e4a068f2f6
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Record test environment
        run: |
          git rev-parse HEAD
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          node --version
          npx playwright --version
          uptime
      - name: Run the unchanged browser PR suite
        run: npm run test:e2e:pr -- --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .test-reports/functional.json
      - name: Verify the report exists on success
        run: test -s .test-reports/functional.json
      - name: Upload Playwright results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-hosted-pr-proof
          include-hidden-files: true
          path: |
            test-results/
            .test-reports/functional.json
          retention-days: 7
          if-no-files-found: warn
