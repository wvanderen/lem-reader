# One-off follow-up to the hosted Ubuntu trial; not intended for main.
# Use the existing manual Evidence workflow so no runner routing or gate changes.
name: Hosted macOS Chromium spot check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-macos-chromium-proof:
    if: github.ref == 'refs/heads/ci/hosted-pr-proof'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      LEM_E2E_BASE: http://localhost:15173
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: 4e744b42e9da8ee6e57fa46edca9d8e4a068f2f6
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - name: Record test environment
        run: |
          git rev-parse HEAD
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          sw_vers
          uname -m
          node --version
          npx playwright --version
          uptime
      - name: Run the three Chromium specs that failed on Ubuntu
        run: >-
          npm run test:e2e:pr -- --project=chromium --reporter=line,json
          tests/e2e/annotations/held-number-selection.spec.ts
          tests/e2e/chrome/read-nav.spec.ts
          tests/e2e/library/sort-control.spec.ts
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .test-reports/functional.json
      - name: Verify the report exists on success
        run: test -s .test-reports/functional.json
      - name: Upload Playwright results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-hosted-macos-chromium-proof
          include-hidden-files: true
          path: |
            test-results/
            .test-reports/functional.json
          retention-days: 7
          if-no-files-found: warn
