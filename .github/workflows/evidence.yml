# One-off parallel PR-suite trial after the single-job macOS run hit 90 min;
# not for main. Uses the existing manual Evidence workflow so no runner routing
# or gate changes. One job per browser, same entry point, same per-job limit.
name: Hosted macOS parallel PR-suite proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-macos-pr-proof:
    if: github.ref == 'refs/heads/ci/hosted-pr-proof'
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      LEM_E2E_BASE: http://localhost:15173
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: 4e744b42e9da8ee6e57fa46edca9d8e4a068f2f6
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install
      - name: Record test environment
        run: |
          git rev-parse HEAD
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          sw_vers
          uname -m
          node --version
          npx playwright --version
          uptime
      - name: Run the unchanged PR suite for ${{ matrix.project }}
        run: npm run test:e2e:pr -- --project=${{ matrix.project }} --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .test-reports/functional-${{ matrix.project }}.json
      - name: Verify the report exists on success
        run: test -s .test-reports/functional-${{ matrix.project }}.json
      - name: Upload Playwright results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-hosted-macos-pr-proof-${{ matrix.project }}
          include-hidden-files: true
          path: |
            test-results/
            .test-reports/functional-${{ matrix.project }}.json
          retention-days: 7
          if-no-files-found: warn
